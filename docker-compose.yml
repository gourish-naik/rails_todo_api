services:
  api:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle install && bundle exec rails s -p 3001 -b '0.0.0.0'"
    volumes:
      - .:/usr/src/app
    ports:
      - "3001:3001"
    depends_on:
      - pg
    env_file:
      - .env.api
  pg:
    image: postgres:15.6
    restart: always
    ports:
      - "5454:5432"
    env_file:
      - .env.docker
    volumes:
      - rails_json_api-data:/var/lib/postgresql/data

volumes:
  rails_json_api-data: